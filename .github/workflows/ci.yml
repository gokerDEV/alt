name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Format, Vet, and Race Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Enforce gofmt formatting gate
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit and integration tests with race detector
        run: go test -count=1 -race ./...

      - name: Build and verify macOS universal .pkg installer
        if: matrix.os == 'macos-latest'
        run: |
          sh ./packaging/macos/build-pkg.sh
          pkgutil --check-signature dist/alt-*-darwin-universal.pkg || true
          ls -lh dist/
